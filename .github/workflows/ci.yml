name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly, against whatever engine versions the runner's Ubuntu ships. The
  # characterisation tests pin recorded engine behaviour (ImageMagick's
  # off-screen GIF frame, libvips' 255-colour cap, LibreOffice's output), so
  # a failure here with no code change means an engine changed behaviour and
  # the registry entry describing it needs revisiting.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# These jobs only read the repository. Default token scope is wider than that,
# and a workflow that never needs write access should not be handed it.
permissions:
  contents: read

# Third-party actions are pinned to commit hashes, not tags: a tag can be moved
# to different code, a hash cannot. Dependabot updates the hashes and keeps the
# version comments in step.

jobs:
  registry:
    name: Validate registry, agents and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the token out of .git/config, where any later step could read it.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"   # tomllib is stdlib from 3.11

      # Check the checker before trusting what it says about the registry.
      - name: Validator self-test
        run: python3 tools/validate_registry.py --self-test

      - name: Validate registry
        run: python3 tools/validate_registry.py

      - name: Validate agent definitions
        run: python3 tools/validate_agents.py

      # ADRs are binding and specs cite the dossier by section, so a dangling
      # reference turns a binding rule into a rumour.
      - name: Check documentation cross-references
        run: python3 tools/check_links.py

  core:
    name: Build and test huh-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Keep the token out of .git/config, where any later step could read it.
          persist-credentials: false
      # Pinned by hash, so the toolchain must be named: this action reads it
      # from the ref name, which a hash does not carry.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c  # v2.9.3
        with:
          workspaces: core

      # Execution dispatches to the engine the plan selected and REFUSES to
      # substitute a different one, so the engines the registry names have to be
      # here. Without them the raster tests fail (correctly) and the PDF
      # cleaning tests skip themselves, which is how CI ended up never
      # exercising the render-and-rebuild path at all.
      - name: Install the engines the registry measures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools poppler-utils \
            ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            imagemagick libreoffice-writer-nogui
          vips --version
          pdftoppm -v
          ffmpeg -version | head -1
          gst-launch-1.0 --version | head -1
          convert -version | head -1
          soffice --version

      - name: Regenerate the corpus
        # Specimens are generated, not committed, so this also proves the
        # generator still produces what the tests expect.
        run: python3 corpus/generate.py

      - name: Video harness self-test
        # Identical streams must score SSIM 1 / PSNR inf, a blurred copy less.
        run: python3 tools/measure_video.py --self-test

      - name: Clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path core/Cargo.toml --release

      - name: Verify capability edges against the corpus
        # The measurement that earns an edge `status = "verified"`. Exits 4 if a
        # measurement contradicts the registry.
        run: |
          cargo build --manifest-path core/Cargo.toml --release
          ./tools/verify_edges.sh 85
