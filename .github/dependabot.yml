# Dependency updates. Grouped and weekly so they arrive as one reviewable PR
# per ecosystem, not a stream. tools/ is standard-library Python, so there is
# no pip entry.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps(cargo)"

  # actions/checkout@v4 already draws a Node 20 deprecation warning in CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
