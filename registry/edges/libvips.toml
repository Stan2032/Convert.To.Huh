color_depth     = { value = "degraded", from = 16, to = 8 }
geometry        = "preserved"
color_profile = "preserved"
metadata      = "lost"
generational  = false

[edge.cost]
time_model   = "linear_pixels"
memory_model = "streaming"
base_ms      = 14

[edge.constraints]
max_input_bytes = 536870912
requires        = []

[edge.verification]
status      = "verified"
specimens   = [
  "corpus/raster/rgb-photo.png",
  "corpus/raster/rgba-gradient.png",
  "corpus/raster/rgba-hard-edge.png",
  "corpus/raster/rgba-opaque.png",
  "corpus/raster/gray16.png",
]
verified_at = "2026-08-21"
verified_by = "capability-cartographer"

[edge.verification.measured]
tool                  = "core/examples/libvips_flags.rs"
engine_build          = "vips-8.15.1"
ssim                  = 1.0
ssim_16bit_input      = 0.9997
comparison_background = "white (irrelevant here — alpha is preserved, so the score is 1.0 against any background)"
note = """
Genuinely lossless, alpha included: SSIM 1.0000 on every 8-bit specimen. The one
exception is gray16 at 0.9997, which is not compression loss — WebP is 8-bit, so
16-bit input is truncated, and `color_depth` records that.

Contrast the DEFAULT invocation above, which is lossy at SSIM 0.8362 on the same
photo. Same engine, same formats, one flag apart, 15,512 bytes versus 1,942.
This pair is the clearest argument in the registry for ADR-0013.

This edge is also what exposed the measurement bug in RESEARCH.md §13.8: it
originally scored 0.4691 on rgba-hard-edge, which is impossible for a lossless
conversion and turned out to be the harness comparing premultiplied against
non-premultiplied stored RGB.
"""

[edge.verification.real_world]
corpus       = "govdocs1"
files        = 39
ran          = 39
contradicted = 0
affected     = { color_depth = 0 }
results      = "corpus/govdocs1/edges.json"


[[edge]]
engine     = "libvips"
invocation = "vips jpegsave IN OUT --background 255"
op         = "Transcode"
from       = "image/png"
to         = "image/jpeg"
from_kind  = "Raster"
to_kind    = "Raster"

[edge.loss]
alpha           = { value = "lost", policy = "composite_white" }
signal_fidelity = "degraded"
color_depth     = { value = "degraded", from = 16, to = 8 }
geometry      = "preserved"
color_profile = "preserved"
metadata      = "lost"
generational  = true

[edge.cost]
time_model   = "linear_pixels"
memory_model = "streaming"
base_ms      = 8

[edge.constraints]
max_input_bytes = 536870912
requires        = []

[edge.verification]
status      = "verified"
specimens   = ["corpus/raster/rgba-gradient.png", "corpus/raster/rgba-hard-edge.png", "corpus/raster/rgb-photo.png"]
verified_at = "2026-08-21"
verified_by = "capability-cartographer"

[edge.verification.measured]
tool                  = "core/examples/libvips_flags.rs"
engine_build          = "vips-8.15.1"
ssim_alpha            = 0.9855
ssim_opaque           = 0.9933
comparison_background = "white"
note = """
The same engine and formats as the default jpegsave edge, differing only by
`--background 255`, which composites transparency onto WHITE instead of black.

Scored against a white-composited original it reaches 0.9855 where the default
invocation reaches 0.4010. That is not evidence this invocation is better — it
is evidence that the comparison background and the flattening policy have to
agree, which is exactly why RESEARCH.md §13.9 says report the policy and never a
winner. Against a BLACK-composited original the ordering would reverse.
"""

[edge.verification.real_world]
corpus       = "govdocs1"
files        = 39
ran          = 39
contradicted = 0
affected     = { alpha = 2, color_depth = 0 }
results      = "corpus/govdocs1/edges.json"
