engine    = "image-rs"
op        = "Transcode"
from      = "image/gif"
to        = "image/png"
from_kind = "Raster"
to_kind   = "Raster"

[edge.loss]
geometry      = "preserved"
color_depth   = "preserved"
alpha         = "preserved"
metadata      = "lost"
generational  = false

[edge.cost]
time_model   = "linear_pixels"
memory_model = "whole-file"
base_ms      = 12

[edge.constraints]
max_input_bytes = 536870912
requires        = []

[edge.verification]
status      = "verified"
specimens   = ["corpus/raster/rgba-gradient.png"]
verified_at = "2026-08-20"
verified_by = "capability-cartographer"

[edge.verification.measured]
tool      = "cargo run --example probe_edges (reverse direction)"
specimens = 1
ssim_mean = 1.0
note = """
Return leg into the PNG pivot, so GIF can reach every other raster target
without its own edge to each. Lossless with respect to the GIF it decodes; it
does not recover the colours palettisation destroyed. Composition keeps that
visible: a PNG -> GIF -> PNG round trip still reports color_depth as lost,
because `lost` is absorbing."""


