id         = "audio/flac"
name       = "Free Lossless Audio Codec"
kinds      = ["AudioPCM"]
extensions = ["flac"]
mime_types = ["audio/flac", "audio/x-flac"]
puid       = "fmt/279"
puid_verified = true
puid_name  = "FLAC (Free Lossless Audio Codec) 1.2.1"
spec_url   = "https://xiph.org/flac/format.html"

preserves = ["signal_fidelity", "audio_channels", "sample_rate", "bit_depth", "time", "metadata"]

[[signatures]]
offset = 0
magic  = "664C6143"      # "fLaC"
weight = "decisive"

[detection]
priority_over = []
container_of  = []

[notes]
text = """
PUID VERIFIED against PRONOM 2026-08-23: fmt/279, "FLAC (Free Lossless Audio
Codec) 1.2.1". PRONOM pins a version we do not; the magic is identical across
versions, so treat fmt/279 as a representative rather than an equivalence.

PRONOM additionally checks the STREAMINFO block that must follow the magic
(`664C6143(80|00)000022`), verifying the first metadata block is well-formed
rather than just finding four bytes.

Lossless by construction, and measured as such: 100.0% band energy retained
against the WAV original on highfreq-mono, versus 90.3% for MP3 at 64k
(docs/RESEARCH.md §14). That pairing is what makes the measurement credible —
without a lossless control, a 90% figure could have been the measuring
instrument rather than the codec.
"""
