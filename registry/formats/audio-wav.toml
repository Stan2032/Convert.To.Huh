id         = "audio/wav"
name       = "Waveform Audio File Format"
kinds      = ["AudioPCM"]
extensions = ["wav", "wave"]
mime_types = ["audio/wav", "audio/x-wav", "audio/vnd.wave"]
puid       = "fmt/141"
puid_verified = false
spec_url   = "https://learn.microsoft.com/en-us/windows/win32/xaudio2/resource-interchange-file-format--riff"

preserves = ["signal_fidelity", "audio_channels", "sample_rate", "bit_depth", "time", "metadata"]

[[signatures]]
offset = 0
magic  = "52494646"      # "RIFF"
weight = "weak"

[[signatures]]
offset = 8
magic  = "57415645"      # "WAVE" — the form type is the discriminator
weight = "decisive"

[detection]
priority_over = []
container_of  = []

[notes]
text = """
RIFF-based, so it needs the same two-signature AND treatment as AVI and WebP:
`RIFF` at offset 0 is shared with those, and the form type at offset 8 is what
actually discriminates. See image-webp.toml for the other half of that lesson.

PUID recorded as fmt/141 but NOT verified — `tools/verify_pronom.py` has not
been run against it. Treat as unconfirmed until it has been.

Uncompressed PCM, so `signal_fidelity = preserved` is achievable here, which is
what makes it the reference format for measuring what lossy codecs destroy
(docs/RESEARCH.md §14).
"""
