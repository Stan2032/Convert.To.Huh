id          = "ffmpeg"
name        = "FFmpeg"
version_pin = ">=7.1,<8"
homepage    = "https://ffmpeg.org/"

[license]
spdx            = "LGPL-2.1-or-later"
build_profiles  = ["lgpl"]
patent_exposure = "h264-h265-mpegla"

[security]
hostility   = "high"
isolation   = "gvisor"
network     = false
delegates   = false

[resources]
memory_model      = "streaming"
concurrency       = "process-per-job"
crash_expected    = false
default_timeout_s = 900

[runtimes]
native = true
wasm   = true

[notes]
text = """
LICENSE: this manifest describes the LGPL build. `--enable-gpl` pulls in libx264
and propagates GPL obligations to anything we distribute, so a GPL build is a
SEPARATE engine entry with build_profiles = ["gpl"], not a flag on this one
(ADR-0007). patent_exposure is recorded independently because H.264/H.265
obligations apply regardless of which license path we take — the two are
routinely conflated and the conflation is expensive.

SECURITY: `hostility: high`. FFmpeg's protocol handlers (HLS and friends) have a
history of SSRF and local-file disclosure. The no-network invariant removes the
precondition entirely (docs/RESEARCH.md §4.5); protocol allowlisting is defence
in depth on top, never the boundary.

WASM: the multithreaded core is ~32 MB and needs cross-origin isolation, is
flagged unstable upstream, and iOS Safari lacks SharedArrayBuffer in workers.
Assume the single-threaded ceiling in browser planning, and prefer WebCodecs
where the codec is supported — 3-10x faster on H.264 (§6.1, §6.2).
"""
