id          = "libreoffice"
name        = "LibreOffice (headless, via unoserver)"
version_pin = ">=24.2,<26"
homepage    = "https://www.libreoffice.org/"

[license]
spdx            = "MPL-2.0"
spdx_components = ["LGPL-3.0-or-later", "GPL-3.0-or-later"]
build_profiles  = ["gpl"]
patent_exposure = "none"
verified        = true
checked         = "2026-08-20"
source          = "https://raw.githubusercontent.com/LibreOffice/core/master/COPYING.MPL"

[security]
hostility   = "extreme"
isolation   = "microvm"
network     = false
delegates   = true

[resources]
memory_model      = "whole-file"
concurrency       = "singleton"
crash_expected    = true
default_timeout_s = 90

[notes]
text = """
PIN WIDENED 2026-11-26 to include 24.2, from ">=25.2". The first LibreOffice
edges were measured on 24.2.7.2 (Ubuntu), the only build anyone here has run;
same reasoning as the ffmpeg pin (rule 11 rejects a build outside its pin).

MEASURED, not just described (docs/RESEARCH.md §19): 60 real Govdocs1 .doc,
.xls and .ppt files converted to PDF one per process, and none crashed. The
crash behaviour below is about long batches through unoserver.
`soffice --headless` writes NOTHING, silently, when another instance holds
the same user profile; the executor reports that as an engine crash.

LICENSE CORRECTED 2026-08-20, and this one changed a routing decision.

The manifest claimed a bare `spdx = "MPL-2.0"`. The core tree ships THREE
license files: COPYING.MPL (Mozilla Public License 2.0, the primary grant),
COPYING.LGPL, and COPYING — which is GPL-3.0. So a single SPDX string cannot
describe this engine, and `spdx_components` was added to the schema to say so.

Consequence: `build_profiles` drops from ["lgpl", "gpl"] to ["gpl"]. Because
GPL-3.0-licensed components are present in the tree, this engine cannot be
assumed safe for the LGPL distribution profile without a component-level audit
that nobody has done. Under ADR-0007 the planner prunes ineligible engines
before search, so this narrowing means **no Office-format route exists in the
LGPL profile** until that audit happens. That is the correct conservative
default: a wrong `build_profiles` value produces routes we must not ship.

The only realistic engine for the Office family, and the worst-behaved process
in the fleet. Observed and documented (docs/RESEARCH.md §3.2): random crashes
with fatal exceptions in core libraries during large batches; corrupt documents
hanging at 100% CPU; unoserver DECLINING BY DESIGN to restart LibreOffice after
a crash; and its own --conversion-timeout killing LibreOffice and taking
unoserver down with it.

Hence: concurrency = "singleton" and crash_expected = true. One document per
instance, its own supervised pool, aggressive wall-clock kill, never sharing a
worker with another engine. Listener mode is still worth it — 50-75% lower CPU,
2-4x throughput vs cold-starting per document.

delegates = true and unavoidable: it spawns helpers. That is a large part of why
the isolation floor is microvm rather than gvisor despite MPL provenance.
`hostility: extreme` here reflects blast radius and unreliability, not a CVE
record comparable to Ghostscript's.
"""
