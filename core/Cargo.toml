[package]
name = "huh-core"
version = "0.1.0"
edition = "2021"
description = "Registry, detector and route planner for Convert.To.Huh"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[[bin]]
name = "huh"
path = "src/bin/huh.rs"
