[package]
name = "huh-core"
version = "0.1.0"
edition = "2021"
description = "Registry, detector and route planner for Convert.To.Huh"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }

[[bin]]
name = "huh"
path = "src/bin/huh.rs"

[dev-dependencies]
# Already in the tree via `image`; used by examples/real_edges.rs to read
# compressed PNG text (zTXt, iTXt) before searching an output for it.
flate2 = "1.1"
